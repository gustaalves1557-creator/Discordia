# Deploy do Discordia na Render (backend + Postgres gerenciado).
# Como usar: suba a pasta Discordia p/ um repositório GitHub e crie
# um Blueprint no dashboard da Render apontando p/ este arquivo.
services:
  - type: web
    name: discordia-server
    runtime: docker
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    plan: free
    healthCheckPath: /api/health
    # Sem disco no plano free (uploads apagam se o serviço reiniciar).
    # P/ uploads permanentes: upgrade p/ Starter e adicione:
    # disk: { name: uploads, mountPath: /data, sizeGB: 1 } + UPLOAD_DIR=/data/uploads
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discordia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: discordia-db
    plan: free
