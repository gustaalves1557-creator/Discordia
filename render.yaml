# Deploy do Discordia na Render (backend + Postgres gerenciado).
# Como usar: suba a pasta Discordia p/ um repositório GitHub e crie
# um Blueprint no dashboard da Render apontando p/ este arquivo.
services:
  - type: web
    name: discordia-server
    runtime: docker
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    plan: free
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discordia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: NODE_ENV
        value: production

databases:
  - name: discordia-db
    plan: free
